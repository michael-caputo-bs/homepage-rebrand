<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Book Your Betstamp PRO Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/funnel.css">
<style>
  .container { max-width: 900px; padding-bottom: 0; }
  h1 { white-space: nowrap; font-size: min(42px, calc((100vw - 40px) / 15.5)); }
  .embed-wrap { max-width: 1120px; margin: 0 auto; }
  #calendly { width: 100%; min-width: 320px; height: 1000px; }
  @media (min-width: 1000px) { #calendly { height: 660px; } }
  .embed-fallback { padding: 48px 16px; text-align: center; font-size: 15px; }

  .sooner { max-width: 560px; margin: 0 auto; font-size: 15px; line-height: 1.5; color: var(--navy); font-weight: 700; }
  .sooner a { display: inline-block; }
  main { padding-bottom: 32px; }
</style>
</head>
<body>
  <main>
    <div class="container">
      <div class="eyebrow">Betstamp PRO</div>
      <h1>Pick a time for your <em>30&#8209;minute demo.</em></h1>
      <p class="sooner">Don't see a time that works, or want to chat sooner? <a class="text-link" id="btn-sooner" href="#" target="_blank" rel="noopener">Message us and we'll set one up →</a></p>
    </div>

    <div class="embed-wrap">
      <div id="calendly"></div>
    </div>
  </main>

  <footer>
    <span class="wordmark">Betstamp <em>PRO</em></span>
    <span class="contact">Questions? Message us on <a class="tg" id="tg-link" href="#" target="_blank" rel="noopener">Telegram</a> or <a class="tg" id="email-link" href="#">email</a></span>
  </footer>

<script src="/funnel.config.js"></script>
<script src="/funnel.js"></script>
<script>
(function () {
  var F = window.Funnel;
  var C = F.config;
  var lead = F.getLead();
  var utms = F.getUtms();

  var calendlyUrl = F.withParams(C.CALENDLY_URL, Object.assign(
    { name: lead.name, email: lead.email },
    utms,
    { hide_gdpr_banner: "1" }
  ));

  var mount = document.getElementById("calendly");

  function fallback() {
    mount.innerHTML = '<p class="embed-fallback"><a class="text-link" target="_blank" rel="noopener">Open the booking calendar →</a></p>';
    mount.querySelector("a").href = calendlyUrl;
  }

  var script = document.createElement("script");
  script.src = C.CALENDLY_WIDGET_JS;
  script.async = true;
  script.onload = function () {
    if (!window.Calendly) return fallback();
    window.Calendly.initInlineWidget({ url: calendlyUrl, parentElement: mount, resize: true });
  };
  script.onerror = fallback;
  document.head.appendChild(script);

  var booked = false;
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com" || !e.data || e.data.event !== "calendly.page_height") return;
    var h = parseInt(e.data.payload && e.data.payload.height, 10);
    if (h > 300) mount.style.height = h + "px";
  });

  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com" || !e.data || e.data.event !== "calendly.event_scheduled") return;
    if (booked) return;
    booked = true;
    var p = e.data.payload || {};
    F.trackThenGo("demo_booked", F.withParams(C.DEMO_CONFIRMED_URL, { name: lead.name, email: lead.email }), {
      calendly_event_uri: (p.event && p.event.uri) || "",
      calendly_invitee_uri: (p.invitee && p.invitee.uri) || ""
    });
  });

  var sooner = document.getElementById("btn-sooner");
  sooner.href = F.withParams(C.CHAT_SOONER_URL, Object.assign({ name: lead.name, email: lead.email }, utms));
  sooner.addEventListener("click", function () { F.track("click_chat_sooner"); });

  F.init("book-demo");
})();
</script>
</body>
</html>
